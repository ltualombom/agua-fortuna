<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agua Fortuna - Clientes</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans">
    <header class="bg-blue-600 text-white shadow-md p-4 flex flex-col items-center justify-center">
        <img src="logo.png" alt="Logo Agua Fortuna" class="h-16 w-auto mb-2 rounded-full shadow-sm bg-white p-1" onerror="this.style.display='none'">
        <h1 class="text-2xl font-bold">💧 Agua Purificada "La Fortuna"</h1>
        <p class="text-sm text-blue-100">Directorio de Clientes</p>
        <div class="mt-3 flex justify-center space-x-2 flex-wrap gap-2">
            <a href="index.html" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm font-medium">📊 Dashboard</a>
            <a href="pedidos.html" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm font-medium">📦 Pedidos</a>
            <a href="clientes.html" class="bg-blue-800 px-3 py-1 rounded text-sm font-bold border border-white">👥 Clientes</a>
            <a href="produccion.html" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm font-medium">🏭 Producción</a>
            <a href="inventario_envases.html" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm font-medium">📦 Stock</a>
            <a href="gastos.html" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm font-medium">💸 Gastos</a>
            <a href="repartidores.html" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm font-medium">🚛 Repartidores</a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 mt-6 space-y-6">
        <div class="bg-white rounded-xl shadow-md p-6 space-y-4">
            <h2 class="text-xl font-semibold text-slate-800 border-b pb-2">➕ Registrar Nuevo Cliente</h2>
            <form onsubmit="registrarCliente(event)" class="space-y-4">
                <input type="text" id="nombre" placeholder="Nombre Completo" required class="w-full border p-2 rounded-lg">
                <input type="tel" id="telefono" placeholder="Número Celular / WhatsApp" required class="w-full border p-2 rounded-lg">
                <input type="text" id="direccion" placeholder="Dirección de Entrega" class="w-full border p-2 rounded-lg">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-lg">💾 Guardar Cliente</button>
            </form>
        </div>

        <div class="bg-white rounded-xl shadow-md p-6 space-y-4">
            <h2 class="text-xl font-semibold text-slate-800 border-b pb-2">📋 Lista de Clientes</h2>
            <div id="listaClientes" class="divide-y max-h-80 overflow-y-auto"></div>
        </div>
    </main>

    <script>
        const API_URL = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
            ? "http://127.0.0.1:8000" : "https://agua-fortuna-api.onrender.com";

        async function cargarClientes() {
            const res = await fetch(`${API_URL}/clientes`);
            const clientes = await res.json();
            const div = document.getElementById('listaClientes');
            div.innerHTML = clientes.map(c => `
                <div class="py-2 flex justify-between items-center">
                    <div>
                        <p class="font-bold">${c.nombre}</p>
                        <p class="text-xs text-slate-500">📞 ${c.telefono} | 📍 ${c.direccion || 'Sin dirección'}</p>
                    </div>
                    <span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded">🔴 ${c.envases_prestados} envases</span>
                </div>
            `).join('');
        }

        async function registrarCliente(e) {
            e.preventDefault();
            await fetch(`${API_URL}/clientes`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    nombre: document.getElementById('nombre').value,
                    telefono: document.getElementById('telefono').value,
                    direccion: document.getElementById('direccion').value
                })
            });
            e.target.reset();
            cargarClientes();
        }
        window.onload = cargarClientes;
    </script>
</body>
</html>
