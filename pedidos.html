<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agua Fortuna - Registro de Pedidos</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans">

    <header class="bg-blue-600 text-white shadow-md p-4 flex flex-col items-center justify-center">
        <img src="logo.png" alt="Logo Agua Fortuna" class="h-16 w-auto mb-2 rounded-full shadow-sm bg-white p-1" onerror="this.style.display='none'">
        <h1 class="text-2xl font-bold">💧 Agua Purificada "La Fortuna"</h1>
        <p class="text-sm text-blue-100">Control de Entregas y Ventas</p>
        <div class="mt-3 flex justify-center space-x-2 flex-wrap gap-2">
            <a href="index.html" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm font-medium">📊 Dashboard</a>
            <a href="pedidos.html" class="bg-blue-800 px-3 py-1 rounded text-sm font-bold border border-white">📦 Pedidos</a>
            <a href="clientes.html" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm font-medium">👥 Clientes</a>
            <a href="produccion.html" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm font-medium">🏭 Producción</a>
            <a href="inventario_envases.html" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm font-medium">📦 Stock</a>
            <a href="gastos.html" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm font-medium">💸 Gastos</a>
            <a href="repartidores.html" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm font-medium">🚛 Repartidores</a>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 mt-6 space-y-6">
        <div class="bg-white rounded-xl shadow-md p-6 space-y-4 border-t-4 border-blue-600">
            <h2 class="text-xl font-semibold text-slate-800 border-b pb-2">📦 Registrar Nuevo Pedido</h2>
            <form id="pedidoForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700">Seleccionar Cliente</label>
                    <select id="selectCliente" required class="w-full mt-1 border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                        <option value="">Cargando clientes...</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700">Botellones Entregados</label>
                        <input type="number" id="botellonesEntregados" value="1" min="1" class="w-full mt-1 border border-slate-300 rounded-lg p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700">Vacíos Recogidos</label>
                        <input type="number" id="botellonesRecogidos" value="1" min="0" class="w-full mt-1 border border-slate-300 rounded-lg p-2">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700">Precio Unitario ($)</label>
                        <input type="number" step="0.01" id="precioUnitario" value="2.00" class="w-full mt-1 border border-slate-300 rounded-lg p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700">Monto Abonado ($)</label>
                        <input type="number" step="0.01" id="montoPagado" value="2.00" class="w-full mt-1 border border-slate-300 rounded-lg p-2">
                    </div>
                </div>
                <button type="button" onclick="guardarPedidoAPI()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-lg transition shadow">
                    💾 Guardar Pedido
                </button>
            </form>
        </div>

        <div id="resultadoSeccion" class="hidden bg-white rounded-xl shadow-md p-6 mt-6 space-y-4 border-l-4 border-green-500">
            <h3 class="text-lg font-bold text-slate-800">✅ Pedido Registrado</h3>
            <div id="resumenTexto" class="text-sm text-slate-600 space-y-1"></div>
            <a id="btnWhatsApp" href="#" target="_blank" class="block text-center bg-green-500 hover:bg-green-600 text-white font-bold p-3 rounded-lg shadow">
                📲 Enviar Comprobante por WhatsApp
            </a>
        </div>
    </main>

    <script>
        const API_URL = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
            ? "http://127.0.0.1:8000"
            : "https://agua-fortuna-api.onrender.com";

        async function cargarClientes() {
            try {
                const res = await fetch(`${API_URL}/clientes`);
                const clientes = await res.json();
                const select = document.getElementById('selectCliente');
                select.innerHTML = '<option value="">-- Seleccionar Cliente --</option>';
                clientes.forEach(c => {
                    select.innerHTML += `<option value="${c.id}">${c.nombre} (Bidones en poder: ${c.envases_prestados})</option>`;
                });
            } catch (err) {
                console.error("Error al cargar clientes:", err);
            }
        }

        async function guardarPedidoAPI() {
            const clienteId = document.getElementById('selectCliente').value;
            const entregados = parseInt(document.getElementById('botellonesEntregados').value) || 0;
            const recogidos = parseInt(document.getElementById('botellonesRecogidos').value) || 0;
            const precio = parseFloat(document.getElementById('precioUnitario').value) || 0;
            const abonado = parseFloat(document.getElementById('montoPagado').value) || 0;

            if (!clienteId) return alert("Por favor selecciona un cliente.");

            const payload = { cliente_id: parseInt(clienteId), botellones_entregados: entregados, botellones_recogidos: recogidos, precio_unitario: precio, monto_pagado: abonado };

            try {
                const res = await fetch(`${API_URL}/pedidos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                document.getElementById('resumenTexto').innerHTML = `
                    <p>👤 <b>Cliente:</b> ${data.cliente_nombre}</p>
                    <p>💵 <b>Total:</b> $${data.total.toFixed(2)}</p>
                    <p>💳 <b>Abonado:</b> $${data.monto_pagado.toFixed(2)}</p>
                    <p>🔴 <b>Saldo envases:</b> ${data.nuevo_saldo_envases} en su poder</p>
                `;
                const mensaje = `Hola ${data.cliente_nombre} 👋, gracias por tu compra en *Agua Fortuna* 💧.\n\n📄 *Resumen de Entrega:*\n• Entregados: ${entregados}\n• Total: $${data.total.toFixed(2)}\n• Abonado: $${data.monto_pagado.toFixed(2)}\n• Saldo actual de envases: ${data.nuevo_saldo_envases} bidones.`;
                const numLimpio = data.cliente_telefono.replace(/\D/g, '');
                document.getElementById('btnWhatsApp').href = `https://wa.me/${numLimpio}?text=${encodeURIComponent(mensaje)}`;
                document.getElementById('resultadoSeccion').classList.remove('hidden');
                cargarClientes();
            } catch (err) {
                alert("Error al guardar pedido.");
            }
        }
        window.onload = cargarClientes;
    </script>
</body>
</html>
