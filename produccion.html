<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agua Fortuna - Producción</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans">
    <header class="bg-blue-600 text-white shadow-md p-4 flex flex-col items-center justify-center">
        <img src="logo.png" alt="Logo Agua Fortuna" class="h-16 w-auto mb-2 rounded-full shadow-sm bg-white p-1" onerror="this.style.display='none'">
        <h1 class="text-2xl font-bold">💧 Agua Purificada "La Fortuna"</h1>
        <p class="text-sm text-blue-100">Embotellado y Producción Diaria</p>
        <div class="mt-3 flex justify-center space-x-2 flex-wrap gap-2">
            <a href="index.html" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm font-medium">📊 Dashboard</a>
            <a href="pedidos.html" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm font-medium">📦 Pedidos</a>
            <a href="clientes.html" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm font-medium">👥 Clientes</a>
            <a href="produccion.html" class="bg-blue-800 px-3 py-1 rounded text-sm font-bold border border-white">🏭 Producción</a>
            <a href="inventario_envases.html" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm font-medium">📦 Stock</a>
            <a href="gastos.html" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm font-medium">💸 Gastos</a>
            <a href="repartidores.html" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm font-medium">🚛 Repartidores</a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 mt-6 space-y-6">
        <div class="bg-white rounded-xl shadow-md p-6 space-y-4 border-t-4 border-blue-600">
            <h2 class="text-xl font-semibold text-slate-800 border-b pb-2">🏭 Registrar Lote Producido</h2>
            <form onsubmit="registrarProduccion(event)" class="space-y-4">
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-blue-50 p-2 rounded text-center">
                        <label class="text-xs font-bold text-blue-900 block">🚰 Botellones 20L</label>
                        <input type="number" id="botellones" value="0" min="0" class="w-full border rounded p-1 text-center font-bold">
                    </div>
                    <div class="bg-emerald-50 p-2 rounded text-center">
                        <label class="text-xs font-bold text-emerald-900 block">🧴 Galones 5L</label>
                        <input type="number" id="galones" value="0" min="0" class="w-full border rounded p-1 text-center font-bold">
                    </div>
                    <div class="bg-indigo-50 p-2 rounded text-center">
                        <label class="text-xs font-bold text-indigo-900 block">🥤 Botellas 625ml</label>
                        <input type="number" id="botellas" value="0" min="0" class="w-full border rounded p-1 text-center font-bold">
                    </div>
                </div>
                <input type="text" id="operador" placeholder="Nombre Operador / Encargado" required class="w-full border p-2 rounded-lg">
                <input type="text" id="observaciones" placeholder="Observaciones del lote" class="w-full border p-2 rounded-lg">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-lg">💾 Guardar Lote e Incrementar Stock</button>
            </form>
        </div>
    </main>

    <script>
        const API_URL = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
            ? "http://127.0.0.1:8000" : "https://agua-fortuna-api.onrender.com";

        async function registrarProduccion(e) {
            e.preventDefault();
            await fetch(`${API_URL}/produccion`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    botellones_20l: parseInt(document.getElementById('botellones').value) || 0,
                    galones_5l: parseInt(document.getElementById('galones').value) || 0,
                    botellas_625ml: parseInt(document.getElementById('botellas').value) || 0,
                    operador: document.getElementById('operador').value,
                    observaciones: document.getElementById('observaciones').value
                })
            });
            alert("Lote guardado e inventario actualizado.");
            e.target.reset();
        }
    </script>
</body>
</html>
